databases:
  - name: forge-db
    databaseName: forgenew
    user: forge

services:
  - type: web
    name: forge-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: forge-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5001
      - key: CORS_ORIGIN
        value: "https://your-frontend-vercel-url.vercel.app" # Update this once Vercel is deployed
