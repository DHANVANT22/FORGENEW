<style>
        .glass-panel {
            background: rgba(28, 28, 33, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .input-dark {
            background-color: #18181B;
            border: 1px solid #242428;
            color: #e5e2e3;
        }
        .input-dark:focus {
            outline: none;
            border-color: #c0182a;
            box-shadow: 0 0 0 2px rgba(192, 24, 42, 0.2);
        }
      </style>

<body class="bg-[#0A0A0B] text-on-surface font-body-md min-h-screen flex flex-col items-center justify-center p-4">
<!-- Suppressed TopNavBar/SideNavBar as this is a transactional Login page -->
<main class="w-full max-w-[420px] relative z-10 flex flex-col items-center">
<!-- Ambient Glow -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[300px] h-[300px] bg-primary-container/10 rounded-full blur-[80px] -z-10 pointer-events-none"></div>
<div class="glass-panel rounded-xl p-8 w-full shadow-2xl relative overflow-hidden">
<!-- Subtle top highlight line -->
<div class="absolute top-0 left-0 right-0 h-[1px] bg-gradient-to-r from-transparent via-primary-container/50 to-transparent"></div>
<div class="text-center mb-10">
<h1 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg tracking-tighter mb-2">HaizoTech</h1>
<p class="font-mono-label text-mono-label text-primary-container uppercase tracking-[0.15em]">Client Portal</p>
</div>
<form class="space-y-6" onsubmit="event.preventDefault();">
<div class="space-y-2">
<label class="block font-body-md text-[14px] text-on-surface-variant" for="email">Email address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant/50 text-[20px]" data-icon="mail">mail</span>
</div>
<input class="input-dark w-full rounded-lg pl-10 pr-4 py-3 font-body-md transition-all duration-300" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block font-body-md text-[14px] text-on-surface-variant" for="password">Password</label>
<a class="font-body-md text-[13px] text-on-surface-variant hover:text-primary transition-colors duration-300" href="#">Forgot password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant/50 text-[20px]" data-icon="lock">lock</span>
</div>
<input class="input-dark w-full rounded-lg pl-10 pr-4 py-3 font-body-md transition-all duration-300" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<button class="w-full bg-primary-container text-white rounded-lg py-3 font-body-md font-medium hover:bg-inverse-primary transition-all duration-300 transform hover:-translate-y-0.5 hover:shadow-[0_4px_20px_rgba(192,24,42,0.3)] mt-8" type="submit">
                    Sign in to your portal
                </button>
</form>
</div>
<div class="mt-8 text-center">
<p class="font-body-md text-[14px] text-on-surface-variant/70">
                Don't have access? <a class="text-on-surface hover:text-primary transition-colors duration-300" href="#">Contact your project team.</a>
</p>
</div>
</main>
</body></html>
